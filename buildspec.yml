version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -f product-service/Dockerfile product-service
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - printf '{"ImageURI":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" > imageDetail.json
      - sed -e "s|<TASK_EXEC_ROLE_ARN>|$TASK_EXEC_ROLE_ARN|g" -e "s|<DB_HOST>|$DB_HOST|g" -e "s|<DB_SECRET_ARN>|$DB_SECRET_ARN|g" -e "s|<AWS_REGION>|$AWS_DEFAULT_REGION|g" taskdef-template.json > taskdef.json
      - sed -e "s|<PUBLIC_SUBNET_1>|$PUBLIC_SUBNET_1|g" -e "s|<PUBLIC_SUBNET_2>|$PUBLIC_SUBNET_2|g" -e "s|<FARGATE_SG>|$FARGATE_SG|g" appspec-template.yaml > appspec.yaml
      - cat taskdef.json
      - cat appspec.yaml

artifacts:
  files:
    - appspec.yaml
    - taskdef.json
    - imageDetail.json
